<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мебельчи · Пульт</title>
<style>
  :root{
    --bg:#0c0f14; --bg2:#11151d; --card:#161b26; --card2:#1c2230; --line:#252d3d;
    --tx:#dfe6f2; --tx2:#8b96ab; --tx3:#5c6779;
    --amber:#e8a838; --green:#4cc38a; --red:#e5534b; --blue:#539bf5; --violet:#b083f0;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--tx);font:14px/1.55 -apple-system,"Segoe UI",Inter,Roboto,sans-serif;padding-bottom:60px}
  a{color:var(--blue)}
  /* ── шапка ── */
  header{position:sticky;top:0;z-index:9;background:linear-gradient(180deg,#0c0f14 75%,#0c0f1400);padding:14px 22px 8px}
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:17px;letter-spacing:.4px}
  .brand em{color:var(--amber);font-style:normal}
  .tabs{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px}
  .tab{border:0;background:none;color:var(--tx2);font:600 13px inherit;padding:7px 16px;border-radius:8px;cursor:pointer}
  .tab.on{background:var(--card2);color:var(--tx)}
  .sp{flex:1}
  .hash{font-family:var(--mono);font-size:11px;color:var(--tx3);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
  .led{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px}
  .led.red{background:var(--red)}
  .stats{display:flex;gap:20px;margin:12px 2px 0;flex-wrap:wrap}
  .stat b{font-size:19px;font-weight:800}
  .stat span{color:var(--tx2);font-size:12px;margin-left:6px}
  input.search{background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:7px 12px;width:230px;font:inherit}
  input.search:focus{outline:1px solid var(--amber)}
  main{padding:10px 22px;max-width:1500px;margin:0 auto}
  /* ── общее ── */
  .chip{display:inline-block;font-family:var(--mono);font-size:10.5px;color:var(--tx2);background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:1px 7px;vertical-align:1px}
  .badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.6px;border-radius:5px;padding:2px 7px;vertical-align:2px}
  .b-BLOCK{background:#3a1a1a;color:#ff8f88}.b-WARN{background:#3a2f14;color:#ffce6b}.b-ADVISORY{background:#16283f;color:#8bc0ff}
  .b-active{background:#12301f;color:#67dba0}.b-nyi{background:#262b36;color:#7d8798}
  .b-measured{background:#12301f;color:#67dba0}.b-observed{background:#3a2f14;color:#ffce6b}.b-standard{background:#16283f;color:#8bc0ff}.b-placeholder{background:#262b36;color:#7d8798}
  .b-chernovik{background:#262b36;color:#9aa5b8}.b-kind{background:#221a33;color:#c9a8ff}
  .file{font-family:var(--mono);font-size:10.5px;color:var(--tx3)}
  .why{color:var(--tx2);margin-top:6px}
  .src{color:var(--tx3);font-size:11.5px;margin-top:6px}
  .src::before{content:"📄 ";opacity:.7}
  h2{font-size:13px;font-weight:800;letter-spacing:1.2px;color:var(--tx2);text-transform:uppercase;margin:26px 0 12px}
  h2 small{font-weight:600;letter-spacing:0;text-transform:none;color:var(--tx3);margin-left:8px}
  /* ── конструкция ── */
  .lab{display:none}.lab.on{display:block}
  .cols{display:flex;gap:18px;align-items:flex-start}
  nav.side{position:sticky;top:118px;min-width:200px;display:flex;flex-direction:column;gap:2px}
  .side button{display:flex;justify-content:space-between;gap:10px;border:0;background:none;color:var(--tx2);font:600 13px inherit;text-align:left;padding:7px 12px;border-radius:8px;cursor:pointer}
  .side button.on{background:var(--card);color:var(--tx)}
  .side button i{font-style:normal;color:var(--tx3);font-size:11px}
  .grow{flex:1;min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
  .card .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .card .hd b{font-size:14.5px}
  .intro{color:var(--tx2);font-size:13px;margin:-4px 0 12px}
  table.opts{border-collapse:collapse;margin-top:8px;font-size:12.5px;width:100%}
  table.opts td{border-top:1px solid var(--line);padding:5px 12px 5px 0;vertical-align:top}
  table.opts td:first-child{font-family:var(--mono);font-size:11px;color:var(--amber);white-space:nowrap}
  table.opts td:nth-child(2){white-space:nowrap;color:var(--tx)}
  table.opts td:last-child{color:var(--tx2)}
  .aff{margin-top:8px}
  .aff .chip{margin-right:4px}
  .val{float:right;color:var(--tx3);font-size:11px}
  /* ── полиция ── */
  .covgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
  .cov{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .cov b{font-size:16px}.cov span{color:var(--tx2);font-size:11.5px}
  .covbar{height:5px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
  .covbar i{display:block;height:100%;background:var(--green)}
  .filters{display:flex;gap:6px;margin:2px 0 14px;flex-wrap:wrap}
  .f{border:1px solid var(--line);background:var(--bg2);color:var(--tx2);font:600 12px inherit;border-radius:20px;padding:4px 13px;cursor:pointer}
  .f.on{border-color:var(--amber);color:var(--amber)}
  .rule{cursor:pointer}
  .rule .det{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
  .rule.open .det{display:block}
  .blocked{background:#2b2313;border:1px solid #4d3d17;border-radius:8px;padding:8px 12px;color:#ffce6b;font-size:12.5px;margin-top:8px}
  /* ── комплекты ── */
  .seal{background:linear-gradient(135deg,#1a1410,#161b26);border:1px solid #4d3d17;border-radius:14px;padding:16px 18px;margin-bottom:12px}
  .seal.red{border-color:#4d2320;background:linear-gradient(135deg,#1a1010,#161b26)}
  .seal b{color:var(--amber);letter-spacing:.8px}
  .seal.red b{color:#ff8f88}
  .seal ul{margin:8px 0 0 18px;color:var(--tx2);font-size:13px}
  .kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:12px}
  .kcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .kcard h3{font-size:16px;display:flex;align-items:center;gap:10px}
  .krow{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:6px 0;font-size:12.5px}
  .krow span{color:var(--tx2)}
  .krow b{font-weight:600;text-align:right}
  .kwhy{color:var(--tx3);font-size:12px;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  .prcard .trg{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:8px}
  .prcard .trg b{color:var(--amber)}
  .psy{margin-top:8px;font-size:12.5px;color:var(--tx2)}
  .psy b{color:var(--violet)}
  footer{position:fixed;bottom:0;left:0;right:0;background:#0c0f14ee;border-top:1px solid var(--line);padding:8px 22px;font-size:11.5px;color:var(--tx3);display:flex;gap:18px;flex-wrap:wrap}
  .empty{padding:60px;text-align:center;color:var(--tx2)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">🎛 МЕБЕЛЬЧИ · <em>ПУЛЬТ</em></div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-lab="konstr">Конструкция</button>
      <button class="tab" data-lab="policiya">Полиция</button>
      <button class="tab" data-lab="komplekty">Комплекты</button>
    </div>
    <div class="sp"></div>
    <input class="search" id="q" placeholder="Поиск: паз, 37мм, CE-1, endowment…">
    <span id="kontrolLed"></span>
    <span class="hash" id="hash"></span>
  </div>
  <div class="stats" id="stats"></div>
</header>
<main>
  <section class="lab on" id="lab-konstr"></section>
  <section class="lab" id="lab-policiya"></section>
  <section class="lab" id="lab-komplekty"></section>
</main>
<footer id="foot"></footer>
<script src="inventar.js"></script>
<script>
const I = window.INVENTAR;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let curGroup = null, fCls = "все", fSt = "все";

if (!I) {
  document.querySelector("main").innerHTML =
    '<div class="empty">Нет инвентаря.<br>Запусти <span class="chip">npm run pult</span> — сканер соберёт его из настоящих файлов.</div>';
} else { render(); }

function render() {
  const red = I.itogo.krasnyh;
  $("#hash").textContent = "hash " + I.hash + " · " + I.generatedAt.slice(0, 16).replace("T", " ");
  $("#kontrolLed").innerHTML = `<span class="led${red ? " red" : ""}"></span><span style="font-size:12px;color:var(--tx2)">контроль ${red ? red + " 🔴" : "чист"}</span>`;
  $("#stats").innerHTML = [
    [I.itogo.nastroek, "настройки · " + I.itogo.sekciy + " секций"],
    [I.itogo.aktivnyh + "/" + I.itogo.pravil, "полиция активна"],
    [I.itogo.zapretov, "запретов слияния"],
    [I.itogo.styazhek, "стяжек"],
    [I.itogo.komplektov, "комплектов"],
    [I.itogo.predlozheniy, "правил роста"],
  ].map(([b, t]) => `<div class="stat"><b>${b}</b><span>${t}</span></div>`).join("");
  $("#foot").innerHTML =
    `<span>Вычислено из ${I.nastroyki.length + I.politsiya.length + I.sliyanie.length + I.styazhki.length + I.komplekty.length + I.predlozheniya.length} физических файлов — ничего не набрано руками (DB/44 §4).</span>` +
    `<span>Дрейф парсера ловит tests/pult_inventar.test.ts.</span><span style="margin-left:auto">Прогоны (дифф на корпусе) — следующий шаг, DB/44 §5.</span>`;
  renderKonstr(); renderPoliciya(); renderKomplekty();
}

// ── ЛАБОРАТОРИЯ 1: КОНСТРУКЦИЯ ──
function renderKonstr(filter = "") {
  const groups = I.nastroyki;
  if (curGroup === null) curGroup = groups[0].id;
  const q = filter.toLowerCase();
  const match = (s) => !q || JSON.stringify(s).toLowerCase().includes(q);
  const side = groups.map((g) => {
    const n = q ? g.settings.filter(match).length : g.settings.length;
    return `<button class="${g.id === curGroup && !q ? "on" : ""}" data-g="${g.id}" ${q && !n ? 'style="opacity:.35"' : ""}>${esc(g.label)} <i>${n}</i></button>`;
  }).join("");
  const shown = q ? groups.map((g) => ({ ...g, settings: g.settings.filter(match) })).filter((g) => g.settings.length)
                  : groups.filter((g) => g.id === curGroup);
  const body = shown.map((g) => `
    <h2>${esc(g.label)} <small>${esc(g.file)}</small></h2>
    <div class="intro">${esc(g.intro)}</div>
    ${g.settings.map(settingCard).join("")}`).join("") || '<div class="empty">ничего не найдено</div>';
  $("#lab-konstr").innerHTML = `<div class="cols"><nav class="side">${side}</nav><div class="grow">${body}</div></div>`;
  document.querySelectorAll(".side button").forEach((b) =>
    b.addEventListener("click", () => { curGroup = b.dataset.g; $("#q").value = ""; renderKonstr(); }));
}
function settingCard(s) {
  const opts = s.options ? `<table class="opts">${s.options.map((o) =>
    `<tr><td>${esc(o.value)}</td><td>${esc(o.label)}</td><td>${esc(o.effect ?? "")}</td></tr>`).join("")}</table>` : "";
  const aff = s.affects ? `<div class="aff">${s.affects.map((a) => `<span class="chip">${esc(a)}</span>`).join("")}</div>` : "";
  const vis = s.visual ? ` <span class="badge b-kind">визуал: ${esc(s.visual)}</span>` : "";
  return `<div class="card">
    <div class="hd"><b>${esc(s.label)}</b>
      <span class="badge b-kind">${esc(s.kind)}${s.unit ? " · " + esc(s.unit) : ""}</span>${vis}
      <span class="chip">${esc(s.path)}</span>
      <span class="val">значение — из профиля; появится с прогоном (v2)</span></div>
    <div class="why">${esc(s.why)}</div><div class="src">${esc(s.source)}</div>${opts}${aff}</div>`;
}

// ── ЛАБОРАТОРИЯ 2: ПОЛИЦИЯ ──
function renderPoliciya(filter = "") {
  const q = filter.toLowerCase();
  const classes = ["CE", "GEO", "CONS", "DET", "SENSE"];
  const cov = classes.map((c) => {
    const rs = I.politsiya.filter((r) => r.cls === c);
    const a = rs.filter((r) => r.status === "active").length;
    return `<div class="cov"><b>${c}</b> <span>${a}/${rs.length} активно</span>
      <div class="covbar"><i style="width:${rs.length ? (100 * a / rs.length) : 0}%"></i></div></div>`;
  }).join("");
  const fl = (arr, cur, key) => arr.map((v) =>
    `<button class="f ${cur === v ? "on" : ""}" data-${key}="${v}">${v}</button>`).join("");
  const rules = I.politsiya.filter((r) =>
    (fCls === "все" || r.cls === fCls) &&
    (fSt === "все" || (fSt === "активно" ? r.status === "active" : r.status !== "active")) &&
    (!q || JSON.stringify(r).toLowerCase().includes(q)));
  const list = rules.map((r) => `
    <div class="card rule" data-uid="${r.uid}">
      <div class="hd"><b>${r.id}</b>
        <span class="badge b-${r.severity}">${r.severity}</span>
        <span class="badge ${r.status === "active" ? "b-active" : "b-nyi"}">${r.status === "active" ? "активно" : "ещё нет"}</span>
        <span style="color:var(--tx2)">${esc(r.title)}</span>
        <span class="sp"></span><span class="chip">${r.uid}</span></div>
      <div class="det"><div class="why">${esc(r.why)}</div><div class="src">${esc(r.source)}</div>
        ${r.blockedBy ? `<div class="blocked">⏳ чем заблокировано: ${esc(r.blockedBy)}</div>` : ""}
        <div class="src" style="margin-top:8px">${esc(r.file)}</div></div>
    </div>`).join("") || '<div class="empty">ничего не найдено</div>';
  const mb = I.sliyanie.map((b) => `
    <div class="card"><div class="hd"><b>${b.id}</b><span style="color:var(--tx2)">${esc(b.title)}</span></div>
    <div class="why">${esc(b.why)}</div><div class="src">${esc(b.source)} · ${esc(b.file)}</div></div>`).join("");
  const cn = I.styazhki.map((c) => `
    <div class="card"><div class="hd"><b>${esc(c.label)}</b>
      <span class="badge b-${c.confidence}">${c.confidence}</span><span class="chip">${c.id}</span></div>
    <div class="why">пласть: Ø${c.faceHole.d_mm10 / 10}×${c.faceHole.depth_mm10 / 10}мм${
      c.edgeHole ? ` · торец: Ø${c.edgeHole.d_mm10 / 10}×${c.edgeHole.depth_mm10 / 10}мм` : ""}</div>
    <div class="src">${esc(c.source)} · ${esc(c.file)}</div></div>`).join("");
  $("#lab-policiya").innerHTML = `
    <div class="covgrid">${cov}</div>
    <div class="filters">${fl(["все", ...classes], fCls, "cls")}<span style="width:14px"></span>${fl(["все", "активно", "ещё нет"], fSt, "st")}</div>
    ${list}
    <h2>Слияние — запреты <small>только MB-8 — настройка, остальное физика</small></h2>${mb}
    <h2>Стяжки — геометрия с уровнем доверия <small>measured → observed → standard → placeholder</small></h2>${cn}`;
  document.querySelectorAll("[data-cls]").forEach((b) => b.addEventListener("click", () => { fCls = b.dataset.cls; renderPoliciya($("#q").value); }));
  document.querySelectorAll("[data-st]").forEach((b) => b.addEventListener("click", () => { fSt = b.dataset.st; renderPoliciya($("#q").value); }));
  document.querySelectorAll(".rule").forEach((el) => el.addEventListener("click", () => el.classList.toggle("open")));
}

// ── ЛАБОРАТОРИЯ 3: КОМПЛЕКТЫ ──
function renderKomplekty(filter = "") {
  const q = filter.toLowerCase();
  const match = (o) => !q || JSON.stringify(o).toLowerCase().includes(q);
  const y = I.yadro, e = I.etika;
  const seals = `
    <div class="seal">🔒 <b>ЯДРО — запечатано</b> · класс ${y.zapechatano.klassy_politsii.join(", ")} нельзя тронуть · ${esc(y.pravilo)}
      <div class="src">${esc(y.istochnik)}</div></div>
    <div class="seal red">🔒 <b>ЭТИКА — запечатана</b><ul>${e.pravila_slovami.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>
      <div class="src">${esc(e.istochnik)}</div></div>`;
  const lim = (v) => v === null ? "∞" : v;
  const cards = I.komplekty.filter(match).map((k) => `
    <div class="kcard"><h3>${esc(k.nazvanie.ru)} <span class="badge b-chernovik">${k.status}</span></h3>
      <div class="src" style="margin:2px 0 10px">${esc(k.file)}${k.nasleduet ? " · наследует «" + esc(k.nasleduet) + "»" : ""}</div>
      <div class="krow"><span>Экспорт</span><b>${k.vklyucheno.eksport.map(esc).join(" · ") || "—"}</b></div>
      <div class="krow"><span>Рендер</span><b>${esc(k.vklyucheno.render)}</b></div>
      <div class="krow"><span>Библиотека</span><b>${esc(k.vklyucheno.biblioteka)}</b></div>
      <div class="krow"><span>Кузница</span><b>${k.vklyucheno.kuznitsa.length ? k.vklyucheno.kuznitsa.length + " инстр." : "—"}</b></div>
      <div class="krow"><span>Мебель / нед</span><b>${lim(k.limity.mebel_v_nedelyu)}</b></div>
      <div class="krow"><span>Палитра</span><b>${k.limity.materialov_v_palitre} / группу</b></div>
      <div class="krow"><span>Полиция</span><b>${k.politsiya.klassy.join(" · ")}</b></div>
      <div class="krow"><span>Правила роста</span><b>${k.predlozheniya.join(" · ") || "—"}</b></div>
      <div class="kwhy">${esc(k.pochemu)}</div></div>`).join("");
  const prs = I.predlozheniya.filter(match).map((r) => `
    <div class="card prcard"><div class="hd"><b>${r.id}</b>
      <span class="badge b-chernovik">${r.status}</span>
      <span style="color:var(--tx2)">${esc(r.nazvanie)}</span><span class="sp"></span><span class="chip">${r.uid}</span></div>
      <div class="trg">если <b>${esc(r.trigger.sobytie)}</b> ≥ ${r.trigger.schyot.min}× за ${r.trigger.schyot.okno_dney} дн
        у [${r.trigger.auditoriya.komplekty.map(esc).join(", ")}] →
        предложить <b>«${esc(r.predlozhenie.komplekt)}»</b> · ${esc(r.predlozhenie.forma)} · ${esc(r.predlozhenie.moment)}</div>
      <div class="why" style="margin-top:8px">«${esc(r.predlozhenie.tekst.ru)}»</div>
      <div class="psy"><b>${esc(r.psihologiya.princip)}</b> — ${esc(r.psihologiya.pochemu)}</div>
      <div class="src">${esc(r.psihologiya.istochnik)}</div>
      <div class="aff" style="margin-top:10px">
        <span class="chip">не чаще ${r.ogranicheniya.ne_chashe_dney} дн</span>
        <span class="chip">макс ${r.ogranicheniya.maks_pokazov} показов</span>
        <span class="chip">отказ — 1 тап</span>
        <span class="chip">стоп &lt; ${r.metrika.stop_esli_nizhe * 100}%</span></div></div>`).join("");
  const kk = I.kontrol.filter((k) => k.vid === "komplekt" || k.vid === "predlozhenie");
  const gate = kk.map((k) =>
    `<span class="chip" style="${k.status === "red" ? "color:#ff8f88;border-color:#4d2320" : "color:#67dba0"}">${k.status === "red" ? "🔴" : "🟢"} ${esc(k.file.split("/").pop())}</span>`).join(" ");
  $("#lab-komplekty").innerHTML = `${seals}
    <h2>Комплекты <small>черновики — содержание решает Пульт, не разработчик (DB/44)</small></h2>
    <div class="kgrid">${cards}</div>
    <h2>Правила роста <small>триггер → предложение · психология с источником · стоп-метрика</small></h2>${prs}
    <h2>Контроль ворот <small>dogovor/kontrol.mjs — ядро + этика + перекрёстные ссылки</small></h2>
    <div class="card">${gate}</div>`;
}

// ── табы и поиск ──
document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t));
  document.querySelectorAll(".lab").forEach((l) => l.classList.toggle("on", l.id === "lab-" + t.dataset.lab));
  applySearch();
}));
$("#q").addEventListener("input", applySearch);
function applySearch() {
  if (!I) return;
  const v = $("#q").value;
  const lab = document.querySelector(".tab.on").dataset.lab;
  if (lab === "konstr") renderKonstr(v);
  if (lab === "policiya") renderPoliciya(v);
  if (lab === "komplekty") renderKomplekty(v);
}
</script>
